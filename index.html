<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
<title>Gabrielle Perfume</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="index.css">
</head>
<body>
<div class="product-card">
  <div class="product-image">
    <img src="images/perfume.jpg" alt="Gabrielle Perfume">
  </div>
  <div class="product-details">
    <p class="category">PERFUME</p>
    <h1>Gabrielle Essence Eau De Parfum</h1>
    <p class="description">
      A floral,solar and voluptous interpretation composed by Oliver Polge, Perfumer-Creator for the House of CHANEL.
    </p>
    <div class="price">
      <span class="fond">$149.99 </span>
      <span class="fund">$169.99</span>
    </div>
    <button>
      <img src="images/icon-cart.svg" alt=" image">
      Add to Cart
    </button>
  </div>
</div>
</body>
</html>
